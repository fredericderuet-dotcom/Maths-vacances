<style>

.xp-pill{background:var(--accent);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;padding:3px 12px;border-radius:20px;}
.streak-pill{background:var(--surface);border:1px solid var(--border);font-size:12px;padding:3px 10px;border-radius:20px;color:var(--warn);}
.pbtn{background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:5px 11px;border-radius:6px;cursor:pointer;transition:all .15s;}

.week-hero p{color:var(--muted);font-size:15px;}
.xp-bar-wrap{background:var(--border);border-radius:4px;height:5px;margin:1rem 0 2rem;overflow:hidden;}
.xp-bar{height:100%;background:var(--accent);border-radius:4px;transition:width .8s;}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:2.5rem;}
.day-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.day-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--border);transition:background .2s;}
.day-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.day-card:hover::before{background:var(--accent);}

.dc-title{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin-bottom:10px;line-height:1.35;}
.dc-tags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:9px;padding:2px 8px;border-radius:5px;background:var(--surface);border:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
.done-tick{position:absolute;top:12px;right:12px;width:22px;height:22px;background:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#0d0e12;font-weight:700;}
#lesson-view{display:none;}
.lh-date{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.lh-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.4rem,4vw,2rem);margin-bottom:10px;line-height:1.2;}
.lh-xp{display:inline-block;background:var(--accent);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;padding:3px 12px;border-radius:20px;margin-bottom:1.75rem;}
.lesson-tabs{display:flex;gap:4px;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:2rem;border:1px solid var(--border);}
.ltab{flex:1;padding:10px;text-align:center;border-radius:7px;cursor:pointer;font-size:13px;font-family:'Syne',sans-serif;font-weight:600;color:var(--muted);transition:all .15s;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;}

      <p>J0 Division · J1 Fractions bases · J2 Fractions opérations</p>

<script>
const DAYS = [
{
  id:0, date:"Avant tout", title:"La division — partager sans paniquer", xp:100, theme:"Bases",
  learn:`
<div class="section-title">C'est quoi diviser ?</div>
<div class="big-idea">
  <div class="label">💡 L'idée de base</div>
  Diviser = <strong>partager en parts égales</strong>.<br><br>
  Tu as 12 bonbons. Tu les partages entre 4 amis. Chacun en a combien ?<br>
  12 ÷ 4 = <strong>3</strong> bonbons chacun.<br><br>
  C'est tout. La division c'est juste ça.
</div>

<div class="sport-block">
  <div class="slabel">🏉 Image rugby</div>
  Il y a 15 joueurs dans une équipe. Le coach les sépare en groupes égaux de 5.<br>
  Combien de groupes ? → 15 ÷ 5 = <strong>3 groupes</strong>.<br><br>
  Autre sens : 15 joueurs, 3 groupes → combien par groupe ? → 15 ÷ 3 = <strong>5 joueurs</strong>.
</div>

<div class="section-title">Les tables de division — la même chose que la multiplication</div>
<div class="big-idea">
  <div class="label">💡 Le secret</div>
  Tu connais déjà les divisions si tu connais les multiplications.<br><br>
  Tu sais que <strong>3 × 4 = 12</strong>.<br>
  Donc tu sais que <strong>12 ÷ 4 = 3</strong> et que <strong>12 ÷ 3 = 4</strong>.<br><br>
  La multiplication et la division sont les deux faces de la même pièce.
</div>

<div class="example-block">
  <div class="elabel">Exemples — lis chaque ligne à voix haute</div>
  <div class="calc-line">6 × 7 = 42 → donc 42 ÷ 7 = 6</div>
  <div class="calc-line">8 × 9 = 72 → donc 72 ÷ 9 = 8</div>
  <div class="calc-line">5 × 6 = 30 → donc 30 ÷ 6 = 5</div>
  <div class="calc-note">Pour vérifier une division : multiplie le résultat par ce qui divise. Tu dois retrouver le départ.</div>
</div>

<div class="section-title">Diviser des grands nombres — la méthode posée</div>
<div class="big-idea">
  <div class="label">💡 Quand c'est trop grand pour la tête</div>
  Pour 84 ÷ 4, on utilise la <strong>division posée</strong>.<br>
  C'est une méthode qu'on fait étape par étape, chiffre par chiffre.
</div>

<div class="method-block">
  <div class="mlabel">Méthode — 84 ÷ 4</div>
  <div class="step"><div class="snum">1</div><div>Je prends le premier chiffre : 8. Est-ce que 4 rentre dans 8 ? Oui : 4×2=8. J'écris 2 en haut.</div></div>
  <div class="step"><div class="snum">2</div><div>8 − (4×2) = 8 − 8 = 0. Je "descends" le chiffre suivant : 4.</div></div>
  <div class="step"><div class="snum">3</div><div>Maintenant j'ai 4. Est-ce que 4 rentre dans 4 ? Oui : 4×1=4. J'écris 1 en haut.</div></div>
  <div class="step"><div class="snum">✓</div><div>Résultat : 21. Vérifie : 21 × 4 = 84 ✓</div></div>
</div>

<div class="example-block">
  <div class="elabel">Exemple complet — 96 ÷ 3</div>
  <div class="calc-line">Premier chiffre : 9. 3×3=9 → j'écris 3 en haut.</div>
  <div class="calc-line">9−9=0, je descends 6. 3×2=6 → j'écris 2 en haut.</div>
  <div class="calc-line">Résultat : 32. Vérif : 32×3=96 ✓</div>
</div>

<div class="section-title">Le reste — quand ça ne tombe pas juste</div>
<div class="big-idea">
  <div class="label">💡 Pas toujours exact</div>

const PARENT_CODE="PAPA";
const getDC=id=>String(id*37).padStart(3,'0');
let ST={xp:0,streak:0,tab:{},qa:{},tries:{},done:{},parentUnlocked:false};
let currentDay=null;
function lvl(x){return x<100?"Apprenti":x<250?"Élève":x<400?"Confirmé":"Expert !";}
function upUI(){
  document.getElementById('xp-top').textContent=ST.xp+' XP';
  document.getElementById('streak-top').textContent='🔥 '+ST.streak;
  const mx=DAYS.reduce((s,d)=>s+d.xp,0);
  document.getElementById('xp-bar').style.width=Math.min(100,ST.xp/mx*100)+'%';
  DAYS.forEach(d=>{if(ST.done[d.id])localStorage.setItem('day_done_'+d.id,'1');});
}
function findDay(id){return DAYS.find(d=>d.id===id);}
function openParentModal(){document.getElementById('parent-modal').classList.add('open');}
function closeParentModal(){document.getElementById('parent-modal').classList.remove('open');document.getElementById('modal-err').style.display='none';}
function checkParentCode(){
  if(document.getElementById('parent-input').value.toUpperCase()===PARENT_CODE){
    ST.parentUnlocked=true;closeParentModal();
    document.getElementById('parent-panel').style.display='block';renderParentPanel();
  }else{document.getElementById('modal-err').style.display='block';setTimeout(()=>{document.getElementById('parent-input').value='';document.getElementById('modal-err').style.display='none';},1800);}
}
function renderParentPanel(){
  const d=findDay(currentDay);
  if(!d){document.getElementById('pp-content').innerHTML='<p style="color:var(--muted);font-size:13px">Ouvre un jour pour voir les résultats.</p>';return;}
  let h='<p style="font-size:12px;color:var(--muted);margin-bottom:.75rem">1 clic = compris du 1er coup ✓ &nbsp;·&nbsp; 2 clics = 1 erreur avant &nbsp;·&nbsp; — = non répondu</p>';
  d.quiz.forEach((q,qi)=>{
    const key=d.id+'_'+qi;
    const clicks=(ST.tries[key]||0)+(ST.qa[key]!==undefined?1:0);
    const ok=ST.qa[key]===q.ans;
    let cls='bad',label='— Non répondu';
    if(ST.qa[key]!==undefined){
      if(ok&&clicks===1){cls='good';label='✓ 1 clic — compris';}
      else if(ok&&clicks===2){cls='warn';label='⚠ 2 clics — 1 erreur';}
      else{cls='bad';label='✗ '+clicks+' clics — incorrect';}
    }
    h+=`<div class="pp-row"><div class="pp-q">Q${qi+1}. ${q.q.substring(0,60)}${q.q.length>60?'...':''}</div><div class="pp-clics ${cls}">${label}</div></div>`;
  });
  document.getElementById('pp-content').innerHTML=h;
}
function renderGrid(){
  document.getElementById('day-grid').innerHTML=DAYS.map(d=>{
    const done=ST.done[d.id];
    const today=new Date().toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
    return`<div class="day-card ${done?'done':''}" onclick="openDay(${d.id})">
      ${done?'<div class="done-tick">✓</div>':''}
      <div class="dc-date">${d.date}</div>
      <div class="dc-title">${d.title}</div>
      <div class="dc-tags"><span class="tag">${d.theme}</span><span class="tag">${d.xp} XP</span></div>
    </div>`;
  }).join('');
}
function openDay(id){
  currentDay=id;
  document.getElementById('main-view').style.display='none';
  document.getElementById('lesson-view').style.display='block';
  const d=findDay(id);
  document.getElementById('lh-date').textContent=d.date;
  document.getElementById('lh-title').textContent=d.title;
  document.getElementById('lh-xp').textContent=`+${d.xp} XP`;
  setTab(ST.tab[id]||'learn');window.scrollTo(0,0);
  if(ST.parentUnlocked)renderParentPanel();
}
function backToGrid(){
  currentDay=null;
  document.getElementById('main-view').style.display='block';
  document.getElementById('lesson-view').style.display='none';
  renderGrid();if(ST.parentUnlocked)document.getElementById('parent-panel').style.display='none';
}
function setTab(tab){
  const d=findDay(currentDay);if(!d)return;
  ST.tab[currentDay]=tab;
  ['learn','quiz','challenges'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===tab);
    document.getElementById('sec-'+t).classList.toggle('hidden',t!==tab);
  });
  if(tab==='learn')renderLearn(d);
  if(tab==='quiz')renderQuiz(d);
  if(tab==='challenges')renderChallenges(d);
}
function renderLearn(d){document.getElementById('sec-learn').innerHTML=d.learn+(ST.done[d.id]?doneBanner(d):'');}
function renderQuiz(d){
  let h='';
  d.quiz.forEach((q,qi)=>{
    const key=d.id+'_'+qi;
    const finalAns=ST.qa[key];
    const triesCount=ST.tries[key]||0;
    const solved=(finalAns!==undefined);
    h+=`<div class="quiz-item" id="qi_${key}"><div class="q-num">Question ${qi+1} / ${d.quiz.length}</div><div class="q-text">${q.q}</div><div class="opts">`;
    q.opts.forEach((opt,oi)=>{
      h+=`<button class="opt" ${solved?'disabled':''} onclick="answerQ(${d.id},${qi},${oi})">${opt}</button>`;
    });
    h+=`</div>`;
    if(!solved&&triesCount===1)h+=`<div class="retry-msg">❌ Mauvaise réponse. Il te reste <strong>1 essai</strong> — réfléchis bien.</div>`;
    if(solved){
      const ok=(finalAns===q.ans);
      h+=`<div class="fb ${ok?'ok':'ko'}"><div class="fb-label">${ok?'✓ Correct !':'✗ Mauvaise réponse'}</div><p style="margin-bottom:${ok?'0':'.75rem'}">${ok?q.exp.ok:q.exp.ko}</p>`;
      if(!ok){h+=`<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.5rem;font-family:'Syne',sans-serif;font-weight:700">Raisonnement étape par étape :</div>`;q.exp.steps.forEach(s=>{h+=`<div class="fb-step"><div class="arr">→</div><div>${s}</div></div>`;});}
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  const allDone=d.quiz.every((_,qi)=>ST.qa[d.id+'_'+qi]!==undefined);
  if(allDone){const c=d.quiz.filter((_,qi)=>ST.qa[d.id+'_'+qi]===d.quiz[qi].ans).length;h+=`<div class="quiz-score">${c}/${d.quiz.length} bonnes réponses ${c===d.quiz.length?'🏆':c>=Math.ceil(d.quiz.length*.75)?'💪':'📚'}</div>`;}
  if(ST.done[d.id])h+=doneBanner(d);
  document.getElementById('sec-quiz').innerHTML=h;
  d.quiz.forEach((q,qi)=>{
    const key=d.id+'_'+qi;const fa=ST.qa[key];if(fa===undefined)return;
    const item=document.getElementById('qi_'+key);if(!item)return;
    item.querySelectorAll('.opt').forEach((btn,oi)=>{btn.className='opt';if(oi===q.ans)btn.classList.add('correct');else if(oi===fa&&fa!==q.ans)btn.classList.add('wrong-final');else btn.classList.add('neutral-off');});
  });
}
function answerQ(dayId,qi,oi){
  const key=dayId+'_'+qi;if(ST.qa[key]!==undefined)return;
  const d=findDay(dayId);const correct=d.quiz[qi].ans;const tries=ST.tries[key]||0;
  if(oi===correct){ST.qa[key]=oi;upUI();renderQuiz(d);if(ST.parentUnlocked)renderParentPanel();return;}
  if(tries===0){
    ST.tries[key]=1;
    const item=document.getElementById('qi_'+key);
    if(item){const btn=item.querySelectorAll('.opt')[oi];if(btn){btn.classList.add('wrong-shake');setTimeout(()=>btn.classList.remove('wrong-shake'),400);}}
    renderQuiz(d);
  }else{ST.qa[key]=oi;renderQuiz(d);}
  if(ST.parentUnlocked)renderParentPanel();
}
function renderChallenges(d){
  const code=getDC(d.id);
  let h=`<div class="ch-info"><span>DÉFIS DU JOUR</span> — Essaie vraiment par toi-même. Écris ton raisonnement complet. Demande le code à tes parents pour voir la correction.</div>`;
  d.challenges.forEach((c,ci)=>{
    const cid=d.id+'_'+ci;
    h+=`<div class="ch-card"><div class="ch-title">${c.title}</div><div class="ch-ctx">${c.ctx}</div>
    <textarea class="answer-input" rows="6" placeholder="Écris ici ton raisonnement et tes calculs étape par étape..."></textarea>
    <div class="code-row">
      <input type="text" class="code-input" id="ci_${cid}" placeholder="CODE" maxlength="3" oninput="this.value=this.value.replace(/\\D/g,'')">
      <button class="unlock-btn" onclick="tryCode('${cid}','${code}')">Voir la correction</button>
      <span class="code-hint">Code 3 chiffres · donné par tes parents</span>
    </div>
    <div class="wrong-code" id="wc_${cid}">❌ Code incorrect, réessaie !</div>
    <div class="ans-reveal" id="ar_${cid}"><div class="ans-label">✓ Correction détaillée</div><div style="line-height:1.85;font-size:14px">${c.ans}</div></div></div>`;
  });
  h+=`<button class="complete-btn" onclick="completeDay(${d.id})">✓ J'ai terminé cette journée — Gagner ${d.xp} XP</button>`;
  if(ST.done[d.id])h+=doneBanner(d);
  document.getElementById('sec-challenges').innerHTML=h;
}
function tryCode(cid,correct){
  const inp=document.getElementById('ci_'+cid),wc=document.getElementById('wc_'+cid),ar=document.getElementById('ar_'+cid);
  if(inp.value===correct){ar.style.display='block';wc.style.display='none';inp.style.borderColor='var(--success)';inp.disabled=true;}
  else{wc.style.display='block';inp.style.borderColor='var(--danger)';setTimeout(()=>{inp.style.borderColor='';inp.value='';wc.style.display='none';},1800);}
}
function completeDay(id){
  if(ST.done[id])return;
  const d=findDay(id);ST.done[id]=true;ST.xp+=d.xp;ST.streak++;
  localStorage.setItem('day_done_'+id,'1');upUI();renderGrid();setTab(ST.tab[id]||'challenges');
}
function doneBanner(d){return`<div class="done-banner"><div class="big">+${d.xp} XP !</div><p style="color:var(--muted);font-size:13px;margin-top:4px">${lvl(ST.xp)} · ${d.date} terminé 🎉</p></div>`;}
renderGrid();upUI();

</script>
</body>
</html>
